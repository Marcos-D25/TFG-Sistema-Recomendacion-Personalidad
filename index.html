<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsychoRecommend AI - Terminal de Análisis</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600&family=Michroma&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid py-4">
    <div class="header-hud text-center mb-5">
        <h1 class="glitch-text">SISTEMA RECOMENDACIÓN</h1>
        <!--%><div class="status-bar">STATUS: <span class="text-success">ONLINE</span> | PROTOCOLO: MBTI-OCEAN v1.0</div><%-->
    </div>

    <div id="chat-section" class="terminal-card mx-auto">
        <div class="terminal-header"><i class="fa-solid fa-terminal me-2"></i> INTERFAZ DE CAPTURA NEURONAL</div>
        <div class="chat-box" id="chat-box"></div>
        <div class="terminal-input-area d-flex">
            <input type="text" id="user-input" class="cyber-input" placeholder="INGRESE RESPUESTA...">
            <button id="btn-dev-skip" class="cyber-button-alt">DUMMY SKIP</button>
            <button id="send-btn" class="cyber-button">ENVIAR</button>
        </div>
    </div>

    <div id="loading-section" class="text-center mt-5 d-none">
        <div class="cyber-loader"></div>
        <h2 class="loading-text mt-4">PROCESANDO PREDICCIÓN...</h2>
    </div>

    <div id="results-section" class="d-none">
        <ul class="nav nav-pills custom-nav-tabs mb-4 justify-content-center" id="myTab" role="tablist">
            <li class="nav-item"><button class="nav-link tab-chat" data-bs-toggle="tab" data-bs-target="#tab-chat"><i class="fa-solid fa-comments"></i> CONVERSACIÓN</button></li>
            <li class="nav-item"><button class="nav-link active tab-mbti" data-bs-toggle="tab" data-bs-target="#tab-mbti"><i class="fa-solid fa-brain"></i> MBTI</button></li>
            <li class="nav-item"><button class="nav-link tab-ocean" data-bs-toggle="tab" data-bs-target="#tab-ocean"><i class="fa-solid fa-chart-simple"></i> OCEAN</button></li>
            <li class="nav-item"><button class="nav-link tab-series" data-bs-toggle="tab" data-bs-target="#tab-series"><i class="fa-solid fa-tv"></i> SERIES</button></li>
            <li class="nav-item"><button class="nav-link tab-pelis" data-bs-toggle="tab" data-bs-target="#tab-pelis"><i class="fa-solid fa-film"></i> CINE</button></li>
            <li class="nav-item"><button class="nav-link tab-musica" data-bs-toggle="tab" data-bs-target="#tab-musica"><i class="fa-solid fa-music"></i> MÚSICA</button></li>
            <li class="nav-item"><button class="nav-link tab-juegos" data-bs-toggle="tab" data-bs-target="#tab-juegos"><i class="fa-solid fa-gamepad"></i> JUEGOS</button></li>
        </ul>

        <div class="tab-content terminal-card p-4 mx-auto" id="myTabContent" style="max-width: 1000px;">
            <div class="tab-pane fade" id="tab-chat"><div class="chat-box readonly-chat" id="chat-history-box"></div></div>
            
            <div class="tab-pane fade show active" id="tab-mbti">
                <div class="text-center">
                    <h1 id="mbti-title" class="mbti-huge"></h1>
                    <p id="mbti-desc" class="mbti-text lead px-5"></p>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-ocean">
                <h4 class="mb-4 text-center" style="color: var(--neon-cyan);">PERFIL DE RASGOS OCEAN</h4>
                <div class="row" id="ocean-container"></div>
            </div>

            <div class="tab-pane fade" id="tab-series">
                <h5 class="mb-4 text-uppercase" style="color: var(--neon-green);">TOP GÉNEROS: <span id="series-genres" class="text-white"></span></h5>
                <div id="series-list"></div>
            </div>
            
            <div class="tab-pane fade" id="tab-pelis">
                <h5 class="mb-4 text-uppercase" style="color: var(--neon-red);">TOP GÉNEROS: <span id="pelis-genres" class="text-white"></span></h5>
                <div id="pelis-list"></div>
            </div>

            <div class="tab-pane fade" id="tab-musica">
                <h5 class="mb-4 text-uppercase" style="color: var(--neon-yellow);">TOP GÉNEROS: <span id="musica-genres" class="text-white"></span></h5>
                <div id="musica-list" ></div>
            </div>

            <div class="tab-pane fade" id="tab-juegos">
                <h5 class="mb-4 text-uppercase" style="color: var(--neon-purple);">TOP GÉNEROS: <span id="juegos-genres" class="text-white"></span></h5>
                <div id="juegos-list"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
